# Client-side nginx: serves KEYFRAMES from your local dataset copy.
#
#   >>> EDIT THE `alias` LINE BELOW to point at your own aic_2025 folder. <<<
#
# Videos are NOT served here - you only have `0/`, which has no `original/`
# folder. Video playback is redirected to the server's nginx instead; see
# NGINX_VIDEO_HOST in .env.
#
# Expected layout (only the prefix changes):
#   <DATA_ROOT>/0/frames/low_res_autoshot/Keyframes_L26/keyframes/L26_V001/00016.avif
#
# So:  location /img/  ->  alias <DATA_ROOT>/
# where <DATA_ROOT> is the folder that CONTAINS `0/`.
# Trailing slashes are required on both the location and the alias.

worker_processes  2;
worker_rlimit_nofile 8192;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # nginx >= 1.21.4 ships image/avif in mime.types (check: grep avif conf/mime.types).
    # On an older build, uncomment this or keyframes arrive as
    # application/octet-stream and will not render.
    # types { image/avif avif; }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    server {
        listen       9027;
        server_name  localhost;

        location /img/ {
            add_header 'Access-Control-Allow-Origin' '*';
            alias /mnt/e/random42/data/aic_2025/;          # <<< EDIT: your DATA_ROOT
            autoindex off;
            expires 30d;
        }

        # ------------------------------------------------------------------
        # OPTIONAL - only if you also have the videos locally
        # (<DATA_ROOT>/original/0/videos/...). If you enable this, also set
        # NGINX_VIDEO_HOST = "http://localhost:9027/video" in .env.
        # ------------------------------------------------------------------
        # location /video/ {
        #     add_header 'Access-Control-Allow-Origin' '*';
        #     add_header 'Accept-Ranges' 'bytes';
        #     add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
        #     alias /mnt/e/random42/data/aic_2025/original/;   # <<< EDIT: your DATA_ROOT + /original/
        #     mp4;
        #     mp4_buffer_size       1m;
        #     mp4_max_buffer_size   5m;
        #     autoindex off;
        # }
    }
}
